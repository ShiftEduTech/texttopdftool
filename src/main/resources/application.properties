spring.application.name=texttopdftool
server.port=${PORT:8080}

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/pdf

# Request / content limits
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}
app.pdf.max-content-chars=${MAX_CONTENT_CHARS:100000}
app.pdf.max-file-name-chars=${MAX_FILE_NAME_CHARS:200}
app.pdf.max-heading-chars=${MAX_HEADING_CHARS:300}
app.share.ttl-minutes=${SHARE_TTL_MINUTES:60}
app.share.max-entries=${SHARE_MAX_ENTRIES:200}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
app.ai.openai-api-key=${OPENAI_API_KEY:}
app.ai.enabled=${AI_ENABLED:true}
app.branding.org-name=${BRAND_ORG_NAME:Shift EduTech}

# Actuator health for Docker
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
